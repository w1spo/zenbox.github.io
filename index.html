<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Pack Opener</title>
</head>
<body style="margin:0; overflow:hidden; background:#111; color:white; font-family:sans-serif;">

  <div id="credits" style="position:fixed; top:10px; left:10px; font-size:18px;">
    💰 Credits: <span id="credits-count">10</span>
  </div>

  <div id="result" style="position:fixed; bottom:20px; width:100%; text-align:center;">
    <p id="result-text"></p>
    <button id="sell-btn" style="display:none;">Sprzedaj</button>
    <button id="send-btn" style="display:none;">Wyślij</button>
  </div>

  <button id="spin-btn" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); font-size:20px; padding:10px 20px;">Losuj</button>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    // --- SCENA ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- ŚWIATŁO ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(0, 2, 2);
    scene.add(directionalLight);

    // --- PACZKI ---
    const boosters = [];
    const colors = [0xff4444,0xff8844,0xffcc44,0x88ff44,0x44ffcc,0x4488ff,0x8844ff,0xcc44ff,0xff44aa,0xffffff];
    const geometry = new THREE.BoxGeometry(1,1.5,0.1);
    const radius = 5;
    const totalBoosters = colors.length;

    function createBoosters() {
      // usuń stare paczki
      boosters.forEach(b=>scene.remove(b.mesh));
      boosters.length = 0;

      for(let i=0; i<totalBoosters; i++){
        const material = new THREE.MeshStandardMaterial({color: colors[i]});
        const booster = new THREE.Mesh(geometry, material);

        const angle = (i / totalBoosters) * Math.PI * 2; // pełne koło
        booster.position.x = Math.sin(angle) * radius;
        booster.position.z = Math.cos(angle) * radius;
        booster.rotation.y = -angle;

        scene.add(booster);
        boosters.push({mesh: booster, angle: angle});
      }
    }

    createBoosters();

    camera.position.set(0, 1.5, 0);
    camera.lookAt(0,1.5,5);

    // --- ANIMACJA ---
    let spinning = false;
    let spinSpeed = 0;
    let openingBooster = null;
    let targetZ = 0;

    function animate(){
      requestAnimationFrame(animate);

      if(spinning){
        spinSpeed *= 0.97; // zwalnianie
        boosters.forEach(b=>{
          b.angle += spinSpeed;
          b.mesh.position.x = Math.sin(b.angle) * radius;
          b.mesh.position.z = Math.cos(b.angle) * radius;
          b.mesh.rotation.y = -b.angle;
        });

        if(spinSpeed < 0.002){
          spinning = false;
          // wybierz paczkę najbliższą osi Z kamery
          let closest = boosters[0];
          let minDist = Math.abs(closest.mesh.position.z - 5);
          boosters.forEach(b=>{
            let dist = Math.abs(b.mesh.position.z - 5);
            if(dist < minDist){ closest = b; minDist = dist; }
          });
          openingBooster = closest.mesh;
          targetZ = 8; // wysunięcie do przodu
          setTimeout(()=>{
            document.getElementById('result-text').textContent = "🎉 Wylosowano: Ultra Rare Card (50$)";
            document.getElementById('sell-btn').style.display = 'inline-block';
            document.getElementById('send-btn').style.display = 'inline-block';
          },1000);
        }
      }

      if(openingBooster){
        openingBooster.position.z = THREE.MathUtils.lerp(openingBooster.position.z, targetZ, 0.1);
      }

      renderer.render(scene, camera);
    }

    animate();

    // --- PRZYCISK LOSUJ ---
    const spinBtn = document.getElementById('spin-btn');
    spinBtn.addEventListener('click', ()=>{
      if(spinning || openingBooster) return;
      spinSpeed = 0.3 + Math.random()*0.3;
      spinning = true;
      spinBtn.style.display = 'none';
    });

    // --- PRZYCISKI SPRZEDAJ/WYŚLIJ ---
    const creditsEl = document.getElementById('credits-count');
    let credits = 10;

    function resetGame(){
      createBoosters();
      openingBooster = null;
      document.getElementById('result-text').textContent = '';
      document.getElementById('sell-btn').style.display = 'none';
      document.getElementById('send-btn').style.display = 'none';
      spinBtn.style.display = 'inline-block';
    }

    document.getElementById('sell-btn').addEventListener('click', ()=>{
      credits += 45;
      creditsEl.textContent = credits;
      alert('Sprzedano! +45 kredytów');
      resetGame();
    });

    document.getElementById('send-btn').addEventListener('click', ()=>{
      alert('📦 Wysłano kartę do Ciebie!');
      resetGame();
    });

    // --- DOPASOWANIE OKNA ---
    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
